<svg width="680" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; font-weight: 400; }
    .lbl { font-size: 11px; font-weight: 400; fill: #888780; }

    /* teal */
    .c-teal rect, .c-teal circle { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .c-teal .th { fill: #085041; }
    .c-teal .ts { fill: #0F6E56; }
    /* coral */
    .c-coral rect, .c-coral circle { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .c-coral .th { fill: #712B13; }
    .c-coral .ts { fill: #993C1D; }
    /* blue */
    .c-blue rect, .c-blue circle { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .c-blue .th { fill: #0C447C; }
    .c-blue .ts { fill: #185FA5; }
    /* purple */
    .c-purple rect, .c-purple circle { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .c-purple .th { fill: #3C3489; }
    .c-purple .ts { fill: #534AB7; }
    /* amber */
    .c-amber rect, .c-amber circle { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .c-amber .th { fill: #633806; }
    .c-amber .ts { fill: #854F0B; }
    /* green */
    .c-green rect, .c-green circle { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
    .c-green .th { fill: #27500A; }
    .c-green .ts { fill: #3B6D11; }
    /* gray */
    .c-gray rect, .c-gray circle { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .c-gray .th { fill: #444441; }
    .c-gray .ts { fill: #5F5E5A; }

    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- background -->
<rect width="680" height="720" fill="#ffffff"/>

<!-- title -->
<text x="40" y="24" class="th" style="fill:#1a1a1a;font-size:15px;">CrabPub – system architecture</text>

<!-- LAYER LABELS -->
<text x="22" y="88"  class="lbl">Client</text>
<text x="22" y="230" class="lbl">Frontend</text>
<text x="22" y="400" class="lbl">Backend</text>
<text x="22" y="575" class="lbl">Data</text>

<!-- ── ROW 1: CLIENT ── -->
<g class="c-teal">
  <rect x="50" y="48" width="160" height="56" rx="8"/>
  <text class="th" x="130" y="70" text-anchor="middle" dominant-baseline="central">Customer browser</text>
  <text class="ts" x="130" y="88" text-anchor="middle" dominant-baseline="central">Menu, locations, modals</text>
</g>
<g class="c-coral">
  <rect x="470" y="48" width="160" height="56" rx="8"/>
  <text class="th" x="550" y="70" text-anchor="middle" dominant-baseline="central">Admin browser</text>
  <text class="ts" x="550" y="88" text-anchor="middle" dominant-baseline="central">Dashboard, CRUD, uploads</text>
</g>

<!-- ── ROW 2: FRONTEND ── -->
<g class="c-gray">
  <rect x="50" y="152" width="580" height="80" rx="12"/>
</g>
<text x="340" y="167" class="lbl" text-anchor="middle">GitHub Pages — static hosting</text>
<g class="c-blue">
  <rect x="76"  y="172" width="160" height="44" rx="8"/>
  <text class="th" x="156" y="194" text-anchor="middle" dominant-baseline="central">React app</text>
  <text class="ts" x="156" y="208" text-anchor="middle" dominant-baseline="central">Hooks, components</text>
</g>
<g class="c-blue">
  <rect x="260" y="172" width="160" height="44" rx="8"/>
  <text class="th" x="340" y="194" text-anchor="middle" dominant-baseline="central">Axios</text>
  <text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central">API communication</text>
</g>
<g class="c-blue">
  <rect x="444" y="172" width="160" height="44" rx="8"/>
  <text class="th" x="524" y="194" text-anchor="middle" dominant-baseline="central">CSS / SCSS</text>
  <text class="ts" x="524" y="208" text-anchor="middle" dominant-baseline="central">Responsive, mobile-first</text>
</g>

<!-- ── ROW 3: BACKEND ── -->
<g class="c-gray">
  <rect x="50" y="315" width="580" height="192" rx="12"/>
</g>
<text x="340" y="331" class="lbl" text-anchor="middle">Docker — containerised API service</text>
<g class="c-purple">
  <rect x="76"  y="345" width="160" height="56" rx="8"/>
  <text class="th" x="156" y="367" text-anchor="middle" dominant-baseline="central">Node.js + Express</text>
  <text class="ts" x="156" y="383" text-anchor="middle" dominant-baseline="central">RESTful API, routing</text>
</g>
<g class="c-coral">
  <rect x="260" y="345" width="160" height="56" rx="8"/>
  <text class="th" x="340" y="367" text-anchor="middle" dominant-baseline="central">Auth middleware</text>
  <text class="ts" x="340" y="383" text-anchor="middle" dominant-baseline="central">Role-based access</text>
</g>
<g class="c-amber">
  <rect x="444" y="345" width="160" height="56" rx="8"/>
  <text class="th" x="524" y="367" text-anchor="middle" dominant-baseline="central">Error handler</text>
  <text class="ts" x="524" y="383" text-anchor="middle" dominant-baseline="central">Validation, centralised</text>
</g>
<!-- API route boxes -->
<g class="c-purple">
  <rect x="76"  y="420" width="116" height="44" rx="8"/>
  <text class="th" x="134" y="437" text-anchor="middle" dominant-baseline="central">Menu routes</text>
  <text class="ts" x="134" y="453" text-anchor="middle" dominant-baseline="central">CRUD, paginate</text>
</g>
<g class="c-purple">
  <rect x="204" y="420" width="116" height="44" rx="8"/>
  <text class="th" x="262" y="437" text-anchor="middle" dominant-baseline="central">Category routes</text>
  <text class="ts" x="262" y="453" text-anchor="middle" dominant-baseline="central">CRUD</text>
</g>
<g class="c-purple">
  <rect x="332" y="420" width="116" height="44" rx="8"/>
  <text class="th" x="390" y="437" text-anchor="middle" dominant-baseline="central">Image routes</text>
  <text class="ts" x="390" y="453" text-anchor="middle" dominant-baseline="central">Upload, manage</text>
</g>
<g class="c-purple">
  <rect x="460" y="420" width="144" height="44" rx="8"/>
  <text class="th" x="532" y="437" text-anchor="middle" dominant-baseline="central">Location routes</text>
  <text class="ts" x="532" y="453" text-anchor="middle" dominant-baseline="central">Per-location toggle</text>
</g>

<!-- ── ROW 4: DATA ── -->
<g class="c-green">
  <rect x="76"  y="556" width="160" height="56" rx="8"/>
  <text class="th" x="156" y="578" text-anchor="middle" dominant-baseline="central">MongoDB</text>
  <text class="ts" x="156" y="594" text-anchor="middle" dominant-baseline="central">Indexed collections, UUID</text>
</g>
<g class="c-green">
  <rect x="260" y="556" width="160" height="56" rx="8"/>
  <text class="th" x="340" y="578" text-anchor="middle" dominant-baseline="central">File storage</text>
  <text class="ts" x="340" y="594" text-anchor="middle" dominant-baseline="central">Image uploads</text>
</g>
<g class="c-teal">
  <rect x="444" y="556" width="160" height="56" rx="8"/>
  <text class="th" x="524" y="578" text-anchor="middle" dominant-baseline="central">Google Maps API</text>
  <text class="ts" x="524" y="594" text-anchor="middle" dominant-baseline="central">Store locations</text>
</g>

<!-- ── ARROWS ── -->
<!-- Client → Frontend -->
<line x1="130" y1="104" x2="130" y2="150" class="arr" stroke="#1D9E75" marker-end="url(#arrow)"/>
<line x1="550" y1="104" x2="550" y2="150" class="arr" stroke="#D85A30" marker-end="url(#arrow)"/>
<!-- Frontend → Backend -->
<line x1="340" y1="216" x2="340" y2="313" class="arr" stroke="#378ADD" marker-end="url(#arrow)"/>
<!-- Backend → Data -->
<line x1="156" y1="464" x2="156" y2="554" class="arr" stroke="#639922" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="340" y2="554" class="arr" stroke="#639922" marker-end="url(#arrow)"/>
<line x1="524" y1="501" x2="524" y2="554" class="arr" stroke="#1D9E75" marker-end="url(#arrow)"/>

<!-- footer -->
<text x="340" y="648" class="lbl" text-anchor="middle">Environment variables secure all credentials and service keys</text>
<text x="340" y="664" class="lbl" text-anchor="middle" style="fill:#aaa;">Avg API response: 300–400 ms</text>
</svg>
